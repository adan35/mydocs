name: Deploy Worker

# Deploys the sharing backend (worker/) to Cloudflare. Setup: docs/SHARING.md.
on:
  push:
    branches: [main]
    paths: ['worker/**', '.github/workflows/worker.yml']
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      AI_API_KEY: ${{ secrets.AI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run worker:deploy
      - run: echo "$SESSION_SECRET" | npx wrangler secret put SESSION_SECRET -c worker/wrangler.toml
      # The default AI key is optional; skip when the secret is not set.
      - if: env.AI_API_KEY != ''
        run: echo "$AI_API_KEY" | npx wrangler secret put AI_API_KEY -c worker/wrangler.toml
