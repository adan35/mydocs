name: Apps

# Builds the desktop installers (Tauri) and mobile apps (Capacitor) from the same
# web code. Pull requests that touch the shells get a build check; tags like
# `v0.2.0` also publish a GitHub release with every installer attached and, once
# the updater signing key exists, the `latest.json` the installed desktop app
# checks for updates (see docs/APPS.md).

on:
  pull_request:
    paths:
      - 'src-tauri/**'
      - 'android/**'
      - 'ios/**'
      - 'capacitor.config.ts'
      - 'src/platform/**'
      - 'scripts/release*'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/apps.yml'
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-22.04
            args: ''
            bundles: src-tauri/target/release/bundle
          - name: Windows
            os: windows-latest
            args: ''
            bundles: src-tauri/target/release/bundle
          - name: macOS
            os: macos-latest
            args: --target universal-apple-darwin
            bundles: src-tauri/target/universal-apple-darwin/release/bundle
    runs-on: ${{ matrix.os }}
    env:
      # Signs the update packages. Without it the installers still build, just no updater files.
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux build dependencies
        if: matrix.name == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      # Optional Apple certificate (docs/APPS.md). Tauri treats an empty APPLE_CERTIFICATE as
      # "sign with this", so the variables are exported only when the secrets actually exist.
      - name: Enable macOS signing and notarization
        if: matrix.name == 'macOS'
        shell: bash
        run: |
          [ -n "$APPLE_CERTIFICATE" ] || { echo "No Apple certificate: building an unsigned app."; exit 0; }
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            echo "$name=${!name}" >> "$GITHUB_ENV"
          done
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: Stamp the tag's version into the app
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/release.mjs set-version "$GITHUB_REF_NAME"
        shell: bash
      - name: Build installers
        shell: bash
        run: |
          extra=""
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            extra="--config src-tauri/tauri.updater.conf.json"
          else
            echo "::notice::TAURI_SIGNING_PRIVATE_KEY is not set: building without update packages."
          fi
          npx tauri build ${{ matrix.args }} $extra
      - uses: actions/upload-artifact@v4
        with:
          name: my-doc-desktop-${{ matrix.name }}
          path: |
            ${{ matrix.bundles }}/macos/*.app.tar.gz
            ${{ matrix.bundles }}/*/*.sig
            ${{ matrix.bundles }}/deb/*.deb
            ${{ matrix.bundles }}/rpm/*.rpm
            ${{ matrix.bundles }}/appimage/*.AppImage
            ${{ matrix.bundles }}/msi/*.msi
            ${{ matrix.bundles }}/nsis/*.exe
            ${{ matrix.bundles }}/dmg/*.dmg
          if-no-files-found: error

  android:
    name: Android
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug
      - name: Build signed release APK and bundle
        # Runs only once the signing secrets exist (see docs/APPS.md).
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        working-directory: android
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          ./gradlew assembleRelease bundleRelease \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.keystore" \
            -Pandroid.injected.signing.store.password="$ANDROID_KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$ANDROID_KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$ANDROID_KEY_PASSWORD"
      - uses: actions/upload-artifact@v4
        with:
          name: my-doc-android
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  ios:
    name: iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: npm ci
      - run: npm run build
      - run: npx cap sync ios
      # Without an Apple developer certificate this can only build for the
      # simulator; it proves the app compiles. Device builds are in docs/APPS.md.
      - name: Build for the iOS Simulator
        working-directory: ios/App
        run: |
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          cd build/Build/Products/Release-iphonesimulator && zip -qry "$GITHUB_WORKSPACE/my-doc-ios-simulator.zip" App.app
      - uses: actions/upload-artifact@v4
        with:
          name: my-doc-ios-simulator
          path: my-doc-ios-simulator.zip
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [desktop, android, ios]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      # Stable file names (so the Download page can link to "latest") plus latest.json.
      - name: Prepare release files
        run: node scripts/release.mjs publish "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" out release
      # Published, not a draft: the app's updater and the Download page read the latest release.
      # Tags with a suffix (v1.2.0-beta.1) are marked pre-release and are not offered as "latest".
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          files: release/*
