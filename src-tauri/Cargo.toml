[package]
name = "my-doc"
version = "0.1.0"
description = "My Doc desktop app"
authors = ["Doerwise"]
license = ""
repository = "https://github.com/adan35/my-doc"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "my_doc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
# tauri::generate_context! expands to serde_json when plugin config (the updater) is present.
serde_json = "1"

# Updating and relaunching only make sense in the desktop app.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
